model: MiniMax-M3
label:
  zh_Hans: MiniMax-M3
  en_US: MiniMax-M3
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
  - vision
  - tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 16000
    min: 1
    max: 65535
  - name: response_format
    use_template: response_format
  - name: thinking
    label:
      zh_Hans: 思考模式
      en_US: Thinking Mode
    type: string
    help:
      zh_Hans: 控制思考模式（thinking.type）。adaptive 自适应开启（默认），disabled 关闭思考。
      en_US: Controls thinking mode (thinking.type). adaptive enables it (default), disabled turns it off.
    required: false
    default: adaptive
    options:
      - adaptive
      - disabled
pricing:
  input: '0.0042'
  output: '0.0168'
  unit: '0.001'
  currency: CNY
