model: doubao-seed-2-1-turbo-260628
label:
  zh_Hans: doubao-seed-2-1-turbo-260628
  en_US: doubao-seed-2-1-turbo-260628
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
  - vision
  - tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 16000
    min: 1
    max: 65535
  - name: response_format
    use_template: response_format
  - name: thinking
    label:
      zh_Hans: 思考模式
      en_US: Thinking Mode
    type: string
    help:
      zh_Hans: 控制思考模式（thinking.type）。enabled 强制开启，disabled 强制关闭，auto 由模型自行判断。
      en_US: Controls thinking mode (thinking.type). enabled forces it on, disabled forces it off, auto lets the model decide.
    required: false
    default: enabled
    options:
      - enabled
      - disabled
      - auto
pricing:
  input: '0.003'
  output: '0.015'
  unit: '0.001'
  currency: CNY
